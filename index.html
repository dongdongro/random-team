<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>랜덤 팀 생성기</title>
  <style>
    :root{font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;color:#172033;background:#f4f6fb}
    *{box-sizing:border-box}body{margin:0;padding:32px 16px}.app{max-width:780px;margin:auto;background:#fff;border:1px solid #e6eaf2;border-radius:20px;padding:28px;box-shadow:0 10px 30px #18233b12}
    h1{margin:0 0 7px;font-size:28px}p{color:#657085;margin:0 0 25px}label{display:block;font-weight:700;margin-bottom:9px}textarea,input{font:inherit;width:100%;border:1px solid #d5dce8;border-radius:12px;padding:13px;background:#fff;color:#172033}textarea{min-height:120px;resize:vertical}.field{margin-bottom:19px}.hint{font-size:13px;color:#64748b;margin-top:7px}
    .actions{display:flex;gap:10px;flex-wrap:wrap}button{font:inherit;cursor:pointer;border-radius:11px;padding:12px 16px;font-weight:700;border:1px solid #d5dce8;background:white;color:#334155}button.primary{background:#365bdb;color:white;border-color:#365bdb}button:hover{filter:brightness(.96)}button:disabled{opacity:.5;cursor:default}
    .message{margin-top:12px;color:#b42318;min-height:22px}.results{margin-top:25px;border-top:1px solid #e6eaf2;padding-top:23px}.results[hidden]{display:none}h2{font-size:20px;margin:0 0 15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:13px}.team{background:#f7f9fd;border:1px solid #e4e9f2;border-radius:14px;padding:17px}.team h3{margin:0 0 12px;font-size:16px;color:#2b49a5}.member{padding:6px 0;border-bottom:1px solid #e6eaf2}.member:last-child{border-bottom:0}.results .actions{margin-top:17px}@media(max-width:500px){.app{padding:21px 17px}h1{font-size:24px}button{width:100%}}
  </style>
</head>
<body>
<main class="app">
  <h1>🎲 랜덤 팀 생성기</h1>
  <p>참가자 명단과 팀 개수를 입력하면 인원을 균등하게 랜덤 배정합니다.</p>
  <div class="field">
    <label for="names">참가자 이름</label>
    <textarea id="names" placeholder="예: 김철수, 이영희, 박민수, 최지훈" spellcheck="false"></textarea>
    <div class="hint">쉼표(,) 또는 줄바꿈으로 이름을 구분하세요.</div>
  </div>
  <div class="field">
    <label for="teamCount">팀 개수</label>
    <input id="teamCount" type="number" min="1" step="1" value="2">
  </div>
  <div class="actions">
    <button class="primary" id="generate">랜덤 팀 생성</button>
    <button id="reset">명단 및 팀 개수 수정</button>
  </div>
  <div class="message" id="message" role="alert" aria-live="polite"></div>
  <section class="results" id="results" hidden aria-live="polite">
    <h2>랜덤 팀 구성 결과</h2>
    <div class="grid" id="teamGrid"></div>
    <div class="actions">
      <button class="primary" id="reroll">🔀 다시 랜덤 팀 짜기</button>
      <button id="copy">📋 결과 복사</button>
    </div>
  </section>
</main>
<script>
  const namesInput=document.getElementById('names');
  const countInput=document.getElementById('teamCount');
  const message=document.getElementById('message');
  const results=document.getElementById('results');
  const teamGrid=document.getElementById('teamGrid');
  let latestTeams=[];
  function shuffle(items){
    const shuffled=[...items];
    for(let i=shuffled.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];
    }
    return shuffled;
  }
  function generate(){
    const participants=namesInput.value.split(/[,\n]/).map(x=>x.trim()).filter(Boolean);
    const count=Number(countInput.value);
    message.textContent='';
    if(participants.length<2){message.textContent='참가자는 최소 2명 이상 입력해주세요.';return;}
    if(!Number.isInteger(count)||count<1||count>participants.length){message.textContent=`팀 개수는 1~${participants.length} 사이의 정수를 입력해주세요.`;return;}
    const teams=Array.from({length:count},()=>[]);
    shuffle(participants).forEach((person,i)=>teams[i%count].push(person));
    latestTeams=teams;
    teamGrid.replaceChildren();
    teams.forEach((team,i)=>{
      const card=document.createElement('div');card.className='team';
      const heading=document.createElement('h3');heading.textContent=`팀 ${i+1} (${team.length}명)`;card.append(heading);
      team.forEach(name=>{const member=document.createElement('div');member.className='member';member.textContent=name;card.append(member)});
      teamGrid.append(card);
    });
    results.hidden=false;
  }
  document.getElementById('generate').addEventListener('click',generate);
  document.getElementById('reroll').addEventListener('click',generate);
  document.getElementById('reset').addEventListener('click',()=>{
    namesInput.value='';countInput.value='2';message.textContent='';results.hidden=true;latestTeams=[];namesInput.focus();
  });
  document.getElementById('copy').addEventListener('click',async()=>{
    const text=latestTeams.map((team,i)=>`팀 ${i+1}: ${team.join(', ')}`).join('\n');
    try{await navigator.clipboard.writeText(text);message.style.color='#15803d';message.textContent='팀 구성 결과를 복사했습니다.';}
    catch{message.style.color='#b42318';message.textContent='복사할 수 없습니다. 브라우저 권한을 확인해주세요.';}
  });
  [namesInput,countInput].forEach(el=>el.addEventListener('input',()=>{message.textContent='';message.style.color='#b42318';results.hidden=true;}));
</script>
</body>
</html>
